<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUB-01 · fibres</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; color:#e8e8ee;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #hud { position:absolute; left:22px; top:18px; pointer-events:none; }
  #hud h1 { margin:0; font-size:24px; letter-spacing:.14em; display:inline-block; background:#ff6a00; color:#0a0a0a; padding:2px 10px; }
  #hud div { color:#8a8a9c; font-size:12px; margin-top:5px; }
  #foot { position:absolute; left:22px; right:22px; bottom:16px; color:#6e6e80; font-size:11px; pointer-events:none; }
  body.clean #hud, body.clean #foot { display:none; }
</style>
</head>
<body>
<div id="hud"><h1>SUB-01</h1><div id="count">loading fibres…</div>
  <div>colour = fibre direction · red left–right · green front–back · blue up–down</div></div>
<div id="foot">Real nerve-fibre bundles traced from one human's diffusion MRI (OpenNeuro ds000031, public domain). Not generated, not simulated.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const q = new URLSearchParams(location.search);
if (q.has("clean")) document.body.classList.add("clean");
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 3000);
const view = q.get("view") || "side";
const views = {side:[-330,20,0], top:[0,0,330], front:[0,330,40], angle:[-240,160,140]};
camera.up.set(0,0,1); camera.position.set(...views[view]);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = !q.has("still"); controls.autoRotateSpeed = 0.5;
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

Promise.all([fetch("fibres.json").then(r=>r.json()), fetch("fibres.bin").then(r=>r.arrayBuffer())]).then(([meta, buf])=>{
  const P = new Float32Array(buf), n = meta.n, k = meta.pts;
  const pos = new Float32Array(n*(k-1)*6), col = new Float32Array(n*(k-1)*6);
  let o = 0;
  for (let s=0; s<n; s++) for (let i=0; i<k-1; i++) {
    const a = (s*k+i)*3, b = a+3;
    const dx=P[b]-P[a], dy=P[b+1]-P[a+1], dz=P[b+2]-P[a+2], L=Math.hypot(dx,dy,dz)||1;
    const r=Math.abs(dx)/L, g=Math.abs(dy)/L, bl=Math.abs(dz)/L;
    for (let j=0;j<3;j++){ pos[o+j]=P[a+j]; pos[o+3+j]=P[b+j]; }
    col[o]=col[o+3]=r; col[o+1]=col[o+4]=g; col[o+2]=col[o+5]=bl; o+=6;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  geo.setAttribute("color", new THREE.BufferAttribute(col,3));
  scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({vertexColors:true, transparent:true,
    opacity: +(q.get("op")||0.35), blending:THREE.AdditiveBlending, depthWrite:false})));
  document.getElementById("count").textContent =
    `${n.toLocaleString()} of ${meta.total.toLocaleString()} traced fibre bundles shown`;
});
if (q.has("cortex")) Promise.all([fetch("cortex.bin").then(r=>r.arrayBuffer()), fetch("cortex_idx.bin").then(r=>r.arrayBuffer())])
.then(([vb, ib])=>{
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(vb), 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(ib), 1)); g.computeVertexNormals();
  const solid = q.get("cortex") === "solid";
  const m = solid ? new THREE.MeshStandardMaterial({color:0xd9a3a3, roughness:0.75, metalness:0.0})
                  : new THREE.MeshBasicMaterial({color:0x9d8cff, transparent:true, opacity:0.05, depthWrite:false, side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(g, m));
  if (solid) { scene.add(new THREE.AmbientLight(0xffffff, 0.35)); const l = new THREE.DirectionalLight(0xffffff, 0.9);
    l.position.set(-200, 150, 250); scene.add(l); const l2 = new THREE.DirectionalLight(0xffffff, 0.4); l2.position.set(200,-100,-50); scene.add(l2); }
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
